<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Broadcast Console</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <h1>BROADCAST CONSOLE</h1>
      <div class="topbar-sub">SISTEMA DE TRANSMISSÃO AO VIVO</div>
    </div>
    <div class="topbar-right">
      <span class="clock" id="clockDisplay">--:--:--</span>
      <span class="live-badge off" id="liveBadge">
        <span class="live-dot"></span>
        <span id="liveBadgeText">FORA DO AR</span>
      </span>
    </div>
  </div>

  <div class="grid">

    <!-- LEFT -->
    <div>
      <div class="preview-box">
        <div class="section-label">MONITOR DE SAÍDA</div>
        <div class="canvas-wrap">
          <canvas id="outCanvas" width="1280" height="720"></canvas>
          <video id="camVideo" playsinline muted></video>
          <div class="src-badge" id="sourceBadge">SEM FONTE</div>
        </div>
        <div class="preview-meta">
          <span>ESPECTADORES: <span id="viewersCount">0</span></span>
          <span id="channelDisplay">CANAL: —</span>
        </div>
      </div>

      <div class="vu-wrap">
        <span class="vu-lbl">VU</span>
        <div id="vuBars"></div>
        <span id="vuDb">-∞</span>
      </div>
      <div class="ledbar-wrap"><div id="ledbar"></div></div>

      <div class="go-live-box">
        <div class="section-label">TRANSMISSÃO</div>
        <label>ID DO CANAL</label>
        <input type="text" id="channelId" placeholder="ex: noticias-ao-vivo" maxlength="64"/>
        <div class="btn-row">
          <button class="btn-go"   id="btnGoLive">▶ IR AO VIVO</button>
          <button class="btn-stop" id="btnStop" disabled>■ ENCERRAR</button>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="sidebar">

      <!-- SOURCE -->
      <div class="card">
        <div class="card-title"><span class="ctdot" style="background:var(--blue)"></span>FONTE DE VÍDEO</div>
        <div class="src-tabs">
          <button class="src-tab active" id="srcFile" onclick="selectSource('file')">📁 ARQUIVO</button>
          <button class="src-tab"        id="srcCam"  onclick="selectSource('cam')">📷 CÂMERA</button>
        </div>

        <div id="fileSourcePanel">
          <input type="file" id="videoFiles" accept="video/*" multiple style="display:none"/>
          <div class="btn-row" style="margin-top:0">
            <button class="btn-blue"  id="btnAddVideos">+ ADICIONAR</button>
            <button class="btn-ghost" id="btnClearPlaylist">✕ LIMPAR</button>
          </div>
          <div class="playlist" id="playlist" style="margin-top:8px"></div>
          <div class="seek-wrap">
            <input type="range" id="videoSeek" class="seek" min="0" max="100" value="0"/>
            <div class="time-row">
              <span id="videoCurrentTime">0:00</span>
              <span id="videoDuration">0:00</span>
            </div>
          </div>
          <div class="pb-row">
            <button class="btn-blue" id="btnPrevVideo">⏮</button>
            <button class="btn-blue" id="btnPlayPause">▶ PLAY</button>
            <button class="btn-blue" id="btnNextVideo">⏭</button>
            <label class="chk"><input type="checkbox" id="loopPlaylist" checked/> LOOP</label>
          </div>
        </div>

        <div id="camSourcePanel" style="display:none">
          <label>CÂMERA</label>
          <select id="camSelect"></select>
          <div class="btn-row">
            <button class="btn-blue" id="btnRefreshCam" style="width:100%">↺ ATUALIZAR</button>
          </div>
        </div>
      </div>

      <!-- MIXER -->
      <div class="card">
        <div class="card-title"><span class="ctdot" style="background:var(--green)"></span>MIXER</div>

        <label>VOLUME MIC &nbsp;<span id="micVal">100</span>%</label>
        <div class="rrow"><input type="range" id="micGain" min="0" max="200" value="100"/><span class="rval" id="micValRight">100%</span></div>

        <label>BRILHO &nbsp;<span id="brightVal">100</span>%</label>
        <div class="rrow"><input type="range" id="videoBright" min="40" max="160" value="100"/><span class="rval" id="brightValRight">100%</span></div>

        <label>CONTRASTE &nbsp;<span id="contrastVal">100</span>%</label>
        <div class="rrow"><input type="range" id="videoContrast" min="50" max="200" value="100"/><span class="rval" id="contrastValRight">100%</span></div>

        <label>SATURAÇÃO &nbsp;<span id="satVal">100</span>%</label>
        <div class="rrow"><input type="range" id="videoSat" min="0" max="200" value="100"/><span class="rval" id="satValRight">100%</span></div>

        <label class="chk"><input type="checkbox" id="muteMic"/> MICROFONE MUDO</label>
        <label class="chk"><input type="checkbox" id="muteVideoAudio"/> ÁUDIO DO VÍDEO MUDO</label>
      </div>

      <!-- GRAFISMO -->
      <div class="card">
        <div class="card-title"><span class="ctdot" style="background:var(--amber)"></span>GRAFISMO</div>

        <label class="chk"><input type="checkbox" id="showLiveTag" checked/> SELO "AO VIVO"</label>
        <label class="chk"><input type="checkbox" id="showDateTime"/> DATA / HORA NA TELA</label>

        <label style="margin-top:8px">TEXTO NA TELA</label>
        <input type="text" id="screenText" placeholder="Título ou aviso..." maxlength="120"/>
        <label>POSIÇÃO</label>
        <select id="screenTextPos">
          <option value="top">Topo</option>
          <option value="center">Centro</option>
          <option value="bottom">Rodapé</option>
        </select>

        <label style="margin-top:8px">TICKER ROLANTE</label>
        <label class="chk"><input type="checkbox" id="tickerOn"/> ATIVAR</label>
        <input type="text" id="tickerText" placeholder="Texto do ticker..." maxlength="400" style="margin-top:4px"/>
        <label>VELOCIDADE</label>
        <div class="rrow"><input type="range" id="tickerSpeed" min="1" max="10" value="4"/><span class="rval" id="tickerSpeedVal">4</span></div>
      </div>

      <!-- OVERLAY -->
      <div class="card">
        <div class="card-title"><span class="ctdot" style="background:var(--blue)"></span>LOGOTIPO / OVERLAY</div>
        <input type="file" id="overlayFile" accept="image/*"/>
        <label>OPACIDADE &nbsp;<span id="overlayOpVal">80</span>%</label>
        <div class="rrow"><input type="range" id="overlayOpacity" min="0" max="100" value="80"/><span class="rval" id="overlayOpRight">80%</span></div>
        <label>POSIÇÃO</label>
        <select id="overlayPos">
          <option value="br">Inferior direito</option>
          <option value="bl">Inferior esquerdo</option>
          <option value="tr">Superior direito</option>
          <option value="tl">Superior esquerdo</option>
          <option value="fill">Tela cheia</option>
        </select>
        <div class="btn-row"><button class="btn-ghost" id="btnClearOverlay">✕ REMOVER</button></div>
      </div>

      <!-- URGENT -->
      <div class="card urgent-card">
        <div class="card-title"><span class="ctdot" style="background:var(--red)"></span>ALERTA URGENTE</div>
        <input type="file" id="urgentFile" accept="image/*"/>
        <label>DURAÇÃO (s)</label>
        <input type="number" id="urgentDuration" value="5" min="1" max="30" style="width:70px"/>
        <div class="btn-row">
          <button class="btn-warn" id="btnUrgent" disabled>⚡ DISPARAR</button>
        </div>
        <p class="hint">Cobre a tela pelo tempo definido.</p>
      </div>

    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
